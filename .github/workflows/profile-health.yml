name: Profile Health & Ecosystem Consistency

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Jeden Montag um 07:00 UTC autonom pruefen
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    name: Check Profile Integrity & Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Profile Health Check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/check_profile_health.py
