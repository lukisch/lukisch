<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 32" width="100%" height="100%">
  <!-- Stitched line -->
  <line x1="40" y1="16" x2="1160" y2="16" stroke="#DDD7D0" stroke-width="2" stroke-dasharray="8,6" />

  <!-- 5 Playful colored discs along the divider -->
  <g transform="translate(200, 16)">
    <circle cx="0" cy="0" r="8" fill="#CC2454" />
    <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
  </g>

  <g transform="translate(400, 16)">
    <circle cx="0" cy="0" r="8" fill="#E46C24" />
    <line x1="0" y1="0" x2="-5" y2="-7" stroke="#7A7169" stroke-width="2" stroke-linecap="round" />
    <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
  </g>

  <g transform="translate(600, 16)">
    <circle cx="0" cy="0" r="11" fill="#CC2454" />
    <circle cx="0" cy="0" r="7" fill="#E46C24" />
    <circle cx="0" cy="0" r="3" fill="#249C54" />
  </g>

  <g transform="translate(800, 16)">
    <circle cx="0" cy="0" r="8" fill="#6C246C" />
    <line x1="0" y1="0" x2="5" y2="-7" stroke="#E46C24" stroke-width="2" stroke-linecap="round" />
    <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
  </g>

  <g transform="translate(1000, 16)">
    <circle cx="0" cy="0" r="8" fill="#0C3C84" />
    <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
  </g>
</svg>
